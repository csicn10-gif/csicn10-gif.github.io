<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>개인정보처리방침</title>
<body style="font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px"><h1>개인정보처리방침</h1><p>이 도구는 운영자 본인의 유튜브 채널에 영상을 올리고 설정을 바꾸는 데만 YouTube Data API를 사용합니다.</p><ul><li>받은 권한 정보는 운영자 컴퓨터에만 저장되며 외부로 보내거나 팔지 않습니다.</li><li>운영자 외 다른 사용자의 정보를 모으지 않습니다.</li><li>Google 계정 설정에서 언제든 접근 권한을 철회할 수 있습니다.</li></ul><p>Google API에서 받은 정보의 사용은 Google API 서비스 사용자 데이터 정책(제한적 사용 요건 포함)을 따릅니다.</p></body></html>
